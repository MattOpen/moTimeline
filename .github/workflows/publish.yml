name: Publish to npm

# Triggered by pushing a version tag, not by every push: an npm version can only
# ever be published once, so the tag is the deliberate "release this" signal.
#
#   npm version patch   (bumps package.json, commits, creates the tag)
#   git push --follow-tags
#
# Auth uses npm Trusted Publishing (OIDC) — no token is stored anywhere.
# Configure once at: npmjs.com -> motimeline -> Settings -> Trusted Publisher
#   Organization/User: MattOpen   Repository: moTimeline
#   Workflow filename: publish.yml
#   Allowed action:    leave "publish directly" UNCHECKED (staged only)
#
# The workflow stages the release; it does not make it public. Approve the
# staged version afterwards on npmjs.com (or `npm stage approve`) with 2FA.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm 11.5.1+; the bundled version is older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The tag must match the version in package.json, otherwise the wrong
      # version would be published under this tag.
      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      # MAINTENANCE.md step 1: the version banners ship inside the bundles.
      - name: Verify version banners
        run: |
          PKG=$(node -p "require('./package.json').version")
          for f in src/moTimeline.js src/moTimeline.css; do
            if ! grep -q "v$PKG" "$f"; then
              echo "$f does not carry the v$PKG banner"
              exit 1
            fi
          done

      # Staged publish: this uploads the version but does NOT make it public.
      # A maintainer approves it afterwards with 2FA (npmjs.com, or `npm stage
      # approve`), which is why the trusted publisher does not need direct
      # publish rights. npm recommends this over allowing direct publishing.
      - name: Stage publish
        run: npm stage publish

      - name: Next step
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "motimeline@$PKG is staged, not yet public." >> $GITHUB_STEP_SUMMARY
          echo "Approve it to release: https://www.npmjs.com/package/motimeline" >> $GITHUB_STEP_SUMMARY
